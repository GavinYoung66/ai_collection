services:
  postgres:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ai_collection
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me}
      POSTGRES_DB: ai_collection
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/seed/init_pg.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_collection"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /data
    volumes:
      - minio_data:/data

  milvus:
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    ports: ["19530:19530", "9091:9091"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  elasticsearch:
    image: ai_collection/elasticsearch-ik:8.11.3
    build:
      context: ./deploy/elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  ocr-service:
    build: ./deploy/ocr
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ===== V5 新增：Gradio 浏览器前端（独立进程，仅内部网络，见 services/rag-service/README.md §E）=====
  gradio:
    build:
      context: .
      dockerfile: deploy/gradio/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - RAG_API_BASE=http://rag-service:8000/api/v1
      # 内部访问 token（生产由运维提供 ADMIN/SUPERVISOR 角色的 JWT，前端不硬编码）
      - RAG_API_TOKEN=${RAG_API_TOKEN:?must set internal token}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_ROOT_PATH=/rag
      # 与 rag-service 共享资产数据卷（图片/表格预览源），gradio app.py 读取同一 env 名
      - KB_ASSETS_DIR=/app/data/assets
    volumes:
      - rag_assets:/app/data/assets
    depends_on:
      rag-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  es_data:
  # V5 新增：内嵌资产本地存储（图片/表格预览源），rag-service 与 gradio 共享
  rag_assets:
