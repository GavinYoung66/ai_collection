name: CI

# 触发器：
# - push 主干 / pull_request：全量门禁（6 job）
# - workflow_call：供批次 4 CD（.github/workflows/cd.yml）以 reusable workflow 复用同一门禁（design D7）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  # 五个有实质测试的服务矩阵；检查名形如 service-test (<service>)
  service-test:
    runs-on: ubuntu-latest
    # T03：CI checkout 无 .env，显式提供非占位测试密钥，满足启动 fail-fast 校验
    env:
      JWT_SECRET: ci_jwt_secret_for_tests_only
      AES_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    strategy:
      fail-fast: false # 任一条目失败不取消其余条目，暴露全部问题（ci-matrix spec：其余 job 仍执行完毕）
      matrix:
        service: [data-platform, rag-service, qc-service, mcp-gateway, complaint-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # D2 统一依赖安装：基线测试包 + 根 requirements.lock + 服务 requirements.runtime.txt（存在才装）
      - name: Install dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # 基线（与旧 ci.yml 一致）
          pip install pytest pytest-asyncio pytest-cov httpx nest-asyncio fastapi uvicorn
          # locust 仅 complaint 需要（对齐旧 ci.yml）；必须在根 lock 之前安装：
          # lock 钉有 pytest==7.4.4 / pytest-asyncio==0.23.0，若在 lock 之后装 locust，
          # 其宽松 pytest 依赖会把 pytest 重升到 9.x 而 pytest-asyncio 停在 0.23.0，
          # 版本撕裂会在 collection 期报 'Package' object has no attribute 'obj'。
          if [ "$SERVICE" = "complaint-service" ]; then pip install locust; fi
          # 根 lock 中 rocketmq-python-client 与 langfuse 存在 otlp 解析耦合（见 lock 注释），
          # 沿用 services/{qc-service,data-platform}/Dockerfile 既定做法：排除该行装 lock 主体，
          # 再单独安装 rocketmq + 对齐 langfuse 的 otlp（common.eventbus 测试也需要 rocketmq 可导入）
          grep -vE '^rocketmq-python-client' ../../requirements.lock > /tmp/requirements.base.lock
          pip install -r /tmp/requirements.base.lock
          pip install 'rocketmq-python-client==5.1.1' 'opentelemetry-exporter-otlp>=1.33.1'
          # 服务运行时增量依赖（当前仅 complaint、mcp-gateway 存在此文件）
          if [ -f requirements.runtime.txt ]; then pip install -r requirements.runtime.txt; fi

      # 非投诉服务统一入口（mcp-gateway 就近使用自带 pytest.ini；其余服务采用根 pytest.ini）
      # qc/rag 的主测试排除 tests/regression，prompt 回归在下一步单独执行一次，避免重复收集
      - name: Run tests
        if: matrix.service != 'complaint-service'
        env:
          PYTHONPATH: ../..
        run: |
          if [ "$SERVICE" = "qc-service" ] || [ "$SERVICE" = "rag-service" ]; then
            pytest tests/ -q --ignore=tests/regression
          else
            pytest tests/ -q
          fi

      - name: Prompt regression (qc/rag)
        if: matrix.service == 'qc-service' || matrix.service == 'rag-service'
        env:
          PYTHONPATH: ../..
        run: pytest tests/regression -q

      # ── complaint-service 特有四阶段（D3：整体迁入旧 ci.yml 既有阶段，覆盖率门禁仅此条目）──
      - name: Unit + Integration (D8 核心覆盖率 ≥85%)
        if: matrix.service == 'complaint-service'
        env:
          PYTHONPATH: ../..
          USE_REAL_INFRA: "0"
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=app.models.state --cov=app.graph.edges \
            --cov=app.mcp.client --cov=app.mcp.errors \
            --cov=app.utils.evidence_helper --cov=app.service.recovery_service \
            --cov-report=term-missing --cov-fail-under=85 -q

      - name: E2E tests
        if: matrix.service == 'complaint-service'
        env:
          PYTHONPATH: ../..
        run: pytest tests/e2e/ -q

      - name: Prompt regression
        if: matrix.service == 'complaint-service'
        env:
          PYTHONPATH: ../..
        run: pytest tests/regression/ -q

      - name: Smoke test
        if: matrix.service == 'complaint-service'
        env:
          PYTHONPATH: ../..
          PORT: "8006"
        run: |
          uvicorn app.main:app --port 8006 &
          sleep 4
          bash ../../scripts/smoke/smoke_complaint_service.sh
          kill %1 || true

      - name: PR self-check summary
        if: matrix.service == 'complaint-service' && always()
        run: |
          echo "## PR Self-Check" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Unit + Integration（D8 核心 cov ≥85%，非整包 app）" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] E2E journey zero failure" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Prompt regression（golden 真跑判责路径，一致率 ≥95%）" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Smoke script exit 0" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Error codes follow common.errors.codes" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 未新建 app/service/event_publisher.py" >> $GITHUB_STEP_SUMMARY

  # 公共 job：common 三个测试目录 + call/case/review 三个脚手架服务 health（1.6 落地）
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # D2 同款依赖安装（仓库根路径；common.eventbus 测试需要 rocketmq 可导入）
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx nest-asyncio fastapi uvicorn
          grep -vE '^rocketmq-python-client' requirements.lock > /tmp/requirements.base.lock
          pip install -r /tmp/requirements.base.lock
          pip install 'rocketmq-python-client==5.1.1' 'opentelemetry-exporter-otlp>=1.33.1'

      # 显式三目录：禁止裸跑 pytest——根 pytest.ini 的 testpaths 夹带 services/qc-service/tests
      # PYTHONPATH=. 保证仓库根入 sys.path：pytest 7.4.x（lock 钉版）下根 pytest.ini addopts 的
      # -p ai_collection_pytest_plugin 在 pythonpath ini 生效前导入，裸 pytest 脚本 cwd 不在 sys.path。
      - name: common tests
        env:
          PYTHONPATH: .
        run: pytest common/tests common/eventbus/tests common/security/tests -q

      - name: Scaffold services health (call/case/review)
        run: |
          for svc in call-service case-service review-service; do
            echo "== $svc health =="
            (cd services/$svc && PYTHONPATH=../.. pytest tests/ -q)
          done

  # T20 依赖漏洞门禁：对单一全局清单 requirements.lock 的钉死条目执行 pip-audit（OSV 源）。
  # 阻断口径：存在任何已知漏洞即失败；确无修复版本的存量项以 --ignore-vuln 显式登记。
  #
  # 已登记例外（vulnerability-management：暴露面 + 缓解 + 复查日期）：
  #   PYSEC-2026-1845 / CVE-2025-71176（pytest，MODERATE，tmpdir 处理）
  #   - 暴露面：pytest 仅测试期依赖，不进入生产镜像；CI 在一次性 runner 内执行，无可信边界外输入。
  #   - 缓解：根 lock 钉 7.4.4 以兼容 pytest-asyncio 0.23 与项目插件；升级 pytest 9 需同步迁移测试栈。
  #   - 复查：2027-05-01，届时随 pytest-asyncio 一并升级后移除本例外。
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Q-002 裁决方案 A：Dockerfile 直钉条目必须与根 lock 一致（消除双源漂移），
      # 带 pins-lock-exempt 标记的独立安装模式文件跳过（如 deploy/ocr）。
      - name: Verify Dockerfile pins match root lock
        run: python scripts/check_dockerfile_pins.py

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit pinned dependencies
        run: |
          set -euo pipefail
          # 仅审计 `name==version` 钉死条目：全量 lock 解析会触发 rocketmq 传递依赖
          # （grpcio-tools）构建，CI 无编译链路；--no-deps 保证只核对已钉版本本身。
          grep -E '^[[:alnum:]_.-]+(\[[^]]*\])?==' requirements.lock > /tmp/requirements.audit.txt
          pip-audit -r /tmp/requirements.audit.txt \
            --no-deps --disable-pip \
            --vulnerability-service osv --timeout 60 \
            --ignore-vuln PYSEC-2026-1845

  # T01 密钥扫描门禁：工作树出现明文密钥即失败。
  # 只扫工作树（--no-git）：历史提交中的既有泄漏须先人工轮换再清理历史，
  # 否则历史遗留会让门禁永久红灯、掩盖新增泄漏。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks scan (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --verbose

  # T32 静态检查门禁：ruff + mypy 存量基线冻结，基线外新增告警即阻断。
  # 口径与本地完全一致：ruff/mypy 版本钉死（requirements.lock），依赖同 D2 配方安装；
  # 基线文件 lint-baseline.json 只降不升（清理存量后 --update 重新生成，评审把关）。
  # 硬约束：本 job 不允许 continue-on-error / || true（lint 按需启用 spec）。
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python_version=3.12：numpy 2.x stub 使用 3.12 `type` 语句（见 pyproject.toml [tool.mypy] 注释）
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # ruff / mypy 版本由 requirements.lock 钉定（ruff==0.1.11 / mypy==1.8.0），
          # 先装 lock 保证工具版本与基线生成时一致，不受最新版规则变更影响
          grep -vE '^rocketmq-python-client' requirements.lock > /tmp/requirements.base.lock
          pip install -r /tmp/requirements.base.lock
          pip install 'rocketmq-python-client==5.1.1' 'opentelemetry-exporter-otlp>=1.33.1'

      - name: Lint baseline gate (ruff + mypy)
        run: python scripts/check_lint_baseline.py

  # 前端门禁（F0 tasks 7.1）：lint / 类型 / 单测 / 分层依赖四道闸，任何一步失败即 job 失败。
  # 硬约束：四个 step 彼此独立，禁止 `|| true`、禁止 `continue-on-error`（覆盖即视为门禁失效）。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # Node 20 已 EOL，且 dependency-cruiser 18 的 engines 为 ^22||^24||>=26，
          # 在 20 下会直接报错退出（本地已用 node:20 容器复现校验）。
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 依赖安全扫描（frontend-security-hardening REQ-4）：高危漏洞即 fail build。
      # 仅审计 level=high（critical 含于 high 以下，--audit-level=high 会同时拦截 critical）。
      - name: npm audit (high)
        run: npm audit --audit-level=high

      # —— 以下四步为四道独立闸门，任一步非 0 退出即中断 job ——
      # ESLint：0 error 为硬红线；warning 冻结基线（--max-warnings 271 定义在 package.json），
      # 禁止新增 warning；存量逐批清理后同步下调该阈值（只降不升）。
      - name: ESLint
        run: npm run lint

      # 必须用 -b：根 tsconfig 是 solution 式（files: []），`--noEmit` 会空转通过（0 文件被检查）
      - name: Type check (vue-tsc)
        run: npx vue-tsc -b --force

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Layered dependency check (depcruise)
        run: npx depcruise src
