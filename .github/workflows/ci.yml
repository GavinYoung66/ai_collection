name: CI

# 触发器：
# - push 主干 / pull_request：全量门禁（6 job）
# - workflow_call：供批次 4 CD（.github/workflows/cd.yml）以 reusable workflow 复用同一门禁（design D7）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  # 五个有实质测试的服务矩阵；检查名形如 service-test (<service>)
  service-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 任一条目失败不取消其余条目，暴露全部问题（ci-matrix spec：其余 job 仍执行完毕）
      matrix:
        service: [data-platform, rag-service, qc-service, mcp-gateway, complaint-service]
        # 逐批点亮期临时排除；对应任务本地验证+CI 转绿后即删除该行：
        exclude:
          - service: complaint-service  # 1.5 迁入四阶段后删除
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # D2 统一依赖安装：基线测试包 + 根 requirements.lock + 服务 requirements.runtime.txt（存在才装）
      - name: Install dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # 基线（与旧 ci.yml 一致；locust 移到 complaint 条件安装）
          pip install pytest pytest-asyncio pytest-cov httpx nest-asyncio fastapi uvicorn
          # 根 lock 中 rocketmq-python-client 与 langfuse 存在 otlp 解析耦合（见 lock 注释），
          # 沿用 services/{qc-service,data-platform}/Dockerfile 既定做法：排除该行装 lock 主体，
          # 再单独安装 rocketmq + 对齐 langfuse 的 otlp（common.eventbus 测试也需要 rocketmq 可导入）
          grep -vE '^rocketmq-python-client' ../../requirements.lock > /tmp/requirements.base.lock
          pip install -r /tmp/requirements.base.lock
          pip install 'rocketmq-python-client==5.1.1' 'opentelemetry-exporter-otlp>=1.33.1'
          # 服务运行时增量依赖（当前仅 complaint、mcp-gateway 存在此文件）
          if [ -f requirements.runtime.txt ]; then pip install -r requirements.runtime.txt; fi
          # locust 仅 complaint 既有测试阶段需要（对齐旧 ci.yml）
          if [ "$SERVICE" = "complaint-service" ]; then pip install locust; fi

      # 非投诉服务统一入口（mcp-gateway 就近使用自带 pytest.ini；其余服务采用根 pytest.ini）
      - name: Run tests
        if: matrix.service != 'complaint-service'
        env:
          PYTHONPATH: ../..
        run: pytest tests/ -q

      # 1.5 起补：complaint-service 四阶段（unit+integration/e2e/regression/smoke）
      # 1.7 起补：ruff（仅 complaint、mcp-gateway，continue-on-error 非阻塞）

  # 公共 job：common 三个测试目录 + call/case/review 三个脚手架服务 health（1.6 落地）
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skeleton placeholder (1.1)
        run: echo "common job skeleton"
