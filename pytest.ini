[pytest]
asyncio_mode = auto
testpaths =
    common/tests
    common/eventbus/tests
    services/qc-service/tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
# -p ai_collection_pytest_plugin：联合跑 rag+qc tests 时分拆子进程，
# 避免两侧 tests.conftest 同名冲突（ImportPathMismatchError）。
# pythonpath=. 保证从服务子目录内运行 pytest（rootdir 仍是仓库根）时插件可导入。
pythonpath = .
addopts = -v --tb=short -p ai_collection_pytest_plugin
