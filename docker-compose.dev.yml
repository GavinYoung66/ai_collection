# RAG 多模态知识库 —— 本地开发调试编排（docker-compose.yml 的 override，仅本地开发用，不纳入 openspec 归档）
#
# 用法：
#   构建+启动全部 7 个服务（+ embedding/rerank mock）：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build \
#       embedding rerank-service data-platform rag-service qc-service call-service case-service complaint-service review-service
#   只起某个服务：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build <svc>
#   qc 演示栈（词库走 rag-service ~50 词 dict + kb/search；不起 call-service）：
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build \
#         postgres redis data-platform rag-service qc-service
#     rag-service depends_on postgres/redis/milvus/elasticsearch/embedding/rerank，会连带 infra。
#     rag-dict-mock 仅轻量冒烟可选，与 rag-service 争用宿主机 8002，不要当演示默认词库。
#
#   【2026-09-11 踩坑，勿再犯】上面这条不是「只拉 5 个镜像」。
#   rag-service 在本文件 depends_on：milvus + elasticsearch + embedding + rerank-service；
#   milvus 再 depends_on etcd + minio。因此会去拉 minio/minio:latest，并解析
#   elasticsearch 的 image: ai_collection/elasticsearch-ik:8.11.3（这是本地 build 名，
#   不是 Docker Hub 上的仓库；本地没有该镜像时 daemon 会当成 docker.io 去拉）。
#   若 Docker Desktop Engine 配了已失效的 registry-mirrors
#   （如 https://docker.mirrors.ustc.edu.cn），会报：
#     lookup docker.mirrors.ustc.edu.cn: no such host
#     failed to resolve reference "docker.io/minio/minio:latest"
#     failed to resolve reference "docker.io/ai_collection/elasticsearch-ik:8.11.3"
#   处理：Docker Desktop → Settings → Docker Engine → 删掉 ustc 这条 mirror，Apply & restart；
#   ES 首次用 build 而不是 pull：
#     docker compose -f docker-compose.yml build elasticsearch
#   镜像已在本地时加 --pull never，避免再走死镜像源。
#   qc 冒烟不需要 call-service；也不要 docker compose up（无服务名）把 ocr/gradio 全拉起来。
#   看日志：       docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f <svc>
#   跑冒烟：       bash scripts/smoke/smoke_all.sh
#   qc 冒烟（不起 call-service）：bash scripts/smoke/smoke_qc.sh
#   停止：         docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#
# 存量缺陷已修（对齐 smoke 版已验证通过的编排）：
#   1. build 上下文：7 个服务由 build: ./services/<svc>（context 缺根路径 requirements.lock/common，
#      构建必失败）改为 context: . + dockerfile: services/<svc>/Dockerfile；
#   2. embedding/rerank 健康检查由 curl 改为 python urllib（mock 镜像是 python-slim，无 curl）；
#   3. 容器内必须用服务名连 PG/Redis/Milvus/ES（.env 是宿主机视角 localhost），显式覆盖；
#   4. rag-service 依赖 ocr-service（图片入库走 http://ocr-service:8200/ocr）。
#      镜像已可本地构建（deploy/ocr/Dockerfile）；未启动时 PNG/JPG 会 DNS 失败并标 failed。
#   5. 7 个服务补 curl 健康检查（镜像已 apt 安装 curl）。
#
# dev 习惯：代码卷挂载（改宿主机代码即生效）+ uvicorn --reload 热重载。
# 架构：全部镜像多架构可用，M 系列 arm64 直接构建/运行；pyahocorasick 等 C 扩展由
#       Dockerfile 内 gcc+libc6-dev 本地编译（arm64 无预编译 wheel），apt/pip 均已走阿里云镜像。

services:
  # ========== 检索链路 mock（真实服务地址可在 .env 切换） ==========
  embedding:
    # 用 Dockerfile.mock 构建（sentence-transformers 依赖延迟安装，真实版镜像在本机不可用），
    # 且不挂载宿主机 ./deploy/embedding（真实 app.py 会覆盖 mock 镜像内的 app.py）
    build:
      context: ./deploy/embedding
      dockerfile: Dockerfile.mock
    ports: ["8100:8100"]
    command:
      ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    healthcheck:
      # mock 镜像为 python-slim 无 curl，改用 python urllib 探活
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=2).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  rerank-service:
    # 与 embedding 同理：Dockerfile.mock 构建，不挂载宿主机真实 app.py
    build:
      context: ./deploy/rerank
      dockerfile: Dockerfile.mock
    ports: ["8101:8101"]
    command:
      ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8101", "--reload"]
    healthcheck:
      # mock 镜像为 python-slim 无 curl，改用 python urllib 探活
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8101/health', timeout=2).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ========== 轻量词库 mock（可选；与 rag-service 争用宿主机 8002，非 qc 演示默认）==========
  # 契约：GET /api/v1/sensitive-words/current.dict ，text/plain，一行一词。
  # 容器内听 8000；宿主机仍占 rag 的 8002，便于 curl localhost:8002。qc 必须用服务名:8000。
  rag-dict-mock:
    image: python:3.11.15-slim
    ports: ["8002:8000"]
    volumes:
      - ./scripts/smoke/mocks/rag_current_dict.py:/app/server.py:ro
      - ./scripts/smoke/mocks/current.dict:/app/current.dict:ro
    working_dir: /app
    command: ["python", "/app/server.py", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/sensitive-words/current.dict', timeout=2).status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== 7 个业务服务（build 均改用根上下文，与 smoke 编排一致） ==========
  data-platform:
    build:
      context: .
      dockerfile: services/data-platform/Dockerfile
    ports: ["8001:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 最小闭环事件（etl.task.done/qc.check.completed）与 qc-service 同实例同库；禁止 0 号库
      QC_REDIS_DB: "3"
      EVENT_BUS: ${EVENT_BUS:-rocketmq}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      ROCKETMQ_PROXY: ${ROCKETMQ_PROXY:-rocketmq-proxy:8081}
      # Docker 网络内用 service name + 内部端口（8000），不用 localhost:8006（宿主机映射）
      COMPLAINT_SERVICE_URL: "http://complaint-service:8000/api/v1"
      QC_SERVICE_URL: "http://qc-service:8000/api/v1"
    volumes:
      - ./services/data-platform/app:/app/app
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    ports: ["8002:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      EMBEDDING_SERVICE_URL: http://embedding:8100
      RERANK_SERVICE_URL: http://rerank-service:8101
      # V4 摘要能力开关（默认开启，与 smoke-v4 一致；关掉则行为回退 V3）
      KB_SUMMARY_ENABLED: "true"
      KB_SUMMARY_ES_BOOST: "1.0"
      KB_SUMMARY_MAX_LEN: "200"
      KB_ASR_OPENING_TRIM_ENABLED: "false"
      # V5 LLM 回答 + LangSmith 追踪（统一开关从 .env 继承，dev 显式透传便于调试）
      KB_LLM_ANSWER_ENABLED: ${KB_LLM_ANSWER_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 关闭时默认值必须为 false，避免漏传时把 LangSmith 又打开
      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai_collection}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_TRACE_URL_TEMPLATE: ${LANGSMITH_TRACE_URL_TEMPLATE:-}
      # Langfuse 本地自托管（与 LangSmith 同构）；容器内不能写 localhost，
      # 统一走 host.docker.internal 访问宿主机 3000
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL_DOCKER:-http://host.docker.internal:3000}
      # P1：PDF 内嵌图 OCR 文搜图（dev 默认开启，生产可按需关闭）
      KB_IMAGE_EXTRACT_ENABLED: ${KB_IMAGE_EXTRACT_ENABLED:-true}
      KB_TABLE_EXTRACT_ENABLED: ${KB_TABLE_EXTRACT_ENABLED:-false}
      SKIP_ES_INIT: "0"
      SKIP_MIGRATE: "0"
      EVENT_BUS: ${EVENT_BUS:-rocketmq}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      ROCKETMQ_PROXY: ${ROCKETMQ_PROXY:-rocketmq-proxy:8081}
    volumes:
      - ./services/rag-service/app:/app/app
      - ./common:/app/common
      - ./scripts/rag:/app/scripts/rag
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      # V5：资产预览源目录（镜像内默认 data/assets = /app/data/assets），
      # dev bind mount 与 gradio 共享同一宿主机目录（覆盖生产命名卷 rag_assets）
      - ./services/rag-service/data/assets:/app/data/assets
    # entrypoint 覆盖：保留 es_init_v4 + alembic 初始化，仅给 uvicorn 加 --reload 热重载
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'if [ "${SKIP_ES_INIT:-0}" != "1" ]; then echo ''[dev] es_init_v4''; python scripts/rag/es_init_v4.py; fi; if [ "${SKIP_MIGRATE:-0}" != "1" ]; then echo ''[dev] alembic upgrade head''; alembic upgrade head; fi; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload',
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      embedding: { condition: service_healthy }
      rerank-service: { condition: service_healthy }
      ocr-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default
      - ai-shared-net

  qc-service:
    build:
      context: .
      dockerfile: services/qc-service/Dockerfile
    ports: ["8003:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Langfuse 本地自托管（与 LangSmith 同构）；容器内经 host.docker.internal 访问宿主机
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL_DOCKER:-http://host.docker.internal:3000}
      # DD-02 §12；host 不含 /api/v1。演示词库走 rag-service（~50 词 current.dict + /kb/search）。
      # 容器内 rag-service 听 8000；宿主机映射 8002。不要用 rag-dict-mock 当默认。
      QC_RAG_SENSITIVE_BASE: http://rag-service:8000
      QC_RAG_INITIAL_TIMEOUT: "3"
      QC_RAG_HOURLY_CRON: "0 * * * *"
      QC_DP_BASE: http://data-platform:8000
      QC_DP_SESSION_PATH: /api/v1/data/sessions/{session_id}/qc-source
      QC_DP_PENDING_QC_PATH: /api/v1/data/sessions:pending-qc
      QC_DP_TIMEOUT: "5"
      QC_LLM_MODEL: qwen-plus
      QC_LLM_TIMEOUT: "5"
      QC_LLM_RETRY: "3"
      QC_LLM_DEGRADE_AFTER: "3"
      QC_DEDUP_WINDOW_MS: "30000"
      QC_AUTO_START_ON_ENDED: "true"
      QC_AUTO_COMPLEMENT_AFTER_ETL: "true"
      QC_TEXT_READY_RETRY_SEC: "30"
      QC_TEXT_READY_RETRY_MAX: "20"
      QC_ALERT_LEVEL_MIN: high
      QC_BATCH_MAX: "100"
      QC_MOCK_LLM: "false"
      QC_DEFAULT_ACTIVE_RULES_VERSION: v1.0
      QC_R14_RAG_ENABLED: "true"
      QC_REDIS_DB: "3"
      EVENT_BUS: ${EVENT_BUS:-rocketmq}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      ROCKETMQ_PROXY: ${ROCKETMQ_PROXY:-rocketmq-proxy:8081}
    volumes:
      - ./services/qc-service/app:/app/app
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      data-platform: { condition: service_started }
      rag-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default
      - ai-shared-net

  call-service:
    build:
      context: .
      dockerfile: services/call-service/Dockerfile
    ports: ["8004:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./services/call-service/app:/app/app
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  case-service:
    build:
      context: .
      dockerfile: services/case-service/Dockerfile
    ports: ["8005:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./services/case-service/app:/app/app
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  complaint-service:
    build:
      context: .
      dockerfile: services/complaint-service/Dockerfile
    ports: ["8006:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "6"
      MCP_GATEWAY_MODE: inline
      # Langfuse 本地自托管（与 LangSmith 同构）；容器内经 host.docker.internal 访问宿主机
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL_DOCKER:-http://host.docker.internal:3000}
      # Mock 默认：不设 RAG_SERVICE_URL；真路径需 USE_MOCK_MCP=false + RAG_SERVICE_URL=http://rag-service:8000
      # 并显式 depends_on rag-service（见 docker-compose.complaint.yml / external-deps README）。
      USE_MOCK_MCP: ${USE_MOCK_MCP:-true}
      # 闭环验收：USE_MOCK_MCP=false 时 rag_kb 桥走 rag-service（端口 8002→容器 8000）
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-service:8000}
      # 批次③ 进程内桥：容器内走 compose alias；本机 uvicorn 直跑时在根 .env 覆盖为 localhost:8001/8003
      DATA_PLATFORM_URL: ${DATA_PLATFORM_URL:-http://data-platform:8000}
      QC_SERVICE_URL: ${QC_SERVICE_URL:-http://qc-service:8000}
      EVENT_BUS: ${EVENT_BUS:-rocketmq}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      ROCKETMQ_PROXY: ${ROCKETMQ_PROXY:-rocketmq-proxy:8081}
      EVENT_BUS_SVC: ${EVENT_BUS_SVC:-cs}
      # 闭环验收仿真开关：judge 停在 human_review 后同栈 auto-approve（生产默认 false）
      SIM_AUTO_REVIEW: ${SIM_AUTO_REVIEW:-false}
    volumes:
      - ./services/complaint-service/app:/app/app
      - ./services/complaint-service/tests:/app/tests
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Mock MCP（USE_MOCK_MCP=true）下法规/质检走 fixture，不需要拉起 rag-service 及其向量栈。
      # 接真 rag_kb MCP→HTTP 时再用 compose profile / 显式 depends_on 加回。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default
      - ai-shared-net

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    ports: ["8007:8000"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./services/review-service/app:/app/app
      - ./common:/app/common
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ===== V5：Gradio 前端 dev 覆盖（build/ports/environment/depends_on 继承 base）=====
  gradio:
    # dev 热更新：预览源改 bind mount，与 rag-service 共享同一宿主机目录
    # （覆盖 base 的命名卷挂载 rag_assets:/app/data/assets）
    volumes:
      - ./services/rag-service/data/assets:/app/data/assets
      # 热更新工作台源码（镜像内路径为 /app/app/app.py）
      - ./services/rag-service/gradio:/app/app
    networks:
      - default
      - ai-shared-net

networks:
  default: {}
  ai-shared-net:
    external: true
    name: ai-shared-net
