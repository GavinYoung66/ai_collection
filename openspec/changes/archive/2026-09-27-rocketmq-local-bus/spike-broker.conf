brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# Allow auto-create so Proxy can create system topics on first boot
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# Listen all interfaces inside container; Proxy reaches broker via docker network
brokerIP1 = rocketmq-broker
