# 前端静态托管（仅内网）：网关 location /admin/ 反代到本服务。
# vite base='/admin/'，产物 COPY 到 root 下的 admin/ 子目录，URI 与文件路径一一对应。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 带内容 hash 的构建产物：长缓存 + immutable，发版即换 hash 天然失效
    location /admin/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 兜底：前端路由（如 /admin/complaints）刷新时回退 index.html
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 入口文档不缓存，保证发版后浏览器立即拿到新资源清单
    location = /admin/index.html {
        add_header Cache-Control "no-cache";
    }

    # 容器内直连根路径时引导到 /admin/
    location = / {
        return 302 /admin/;
    }
}
