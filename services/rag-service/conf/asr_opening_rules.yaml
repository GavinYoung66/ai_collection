# ASR 通话开场白规则裁剪配置（V4，design.md D6 / D8 落地）
#
# 用途：ASR 转写文本拼接完成后，对文本开头进行催收通话开场模式识别
#       （问候语 / 身份确认 / 公司名模式），命中则裁剪至首个有效业务内容起点，
#       去除"喂 / 你好 / 请问是…"类开场噪声，提升口语转写的语义密度。
#
# 触发与保底逻辑（保守设计）：
#   - 仅当 KB_ASR_OPENING_TRIM_ENABLED=true 时生效；开关关闭 = V3 行为（不裁剪）。
#   - 纯规则实现（正则 + 关键词表），零 LLM、零新第三方依赖。
#   - 只在文本开头 leading_max_len 字符窗口内匹配，不扫描全文，避免误删正文中的重复问候语。
#   - 模式之间允许逗号 / 句号 / 感叹号 / 空格等分隔，逐段顺序消费；首个不命中的位置即正文起点。
#   - 裁剪后剩余文本少于 trim_min_remain_len 字符（或为空）时判定为误识别，不裁剪（保底）。
#   - 文件缺失 / 解析失败：按开关关闭处理（不裁剪），不影响既有转写链路。

leading_max_len: 60        # 开场白识别窗口（字符）：文本长度 ≤ 该值或超出窗口后即视为正文
trim_min_remain_len: 10    # 裁剪后剩余最小长度（字符）：不足则保底不裁

patterns:
  # 问候语模式：喂 / 你好 / 您好 及其组合（允许中间夹杂标点）
  - name: greeting
    regex: "(喂+[，,。\\s]*)?(你|您)好"
  # 单个问候词模式：喂 / 嗯 / 诶 后必须紧跟标点或空白，避免误吞"喂您好"之外的正文
  - name: greeting_bare
    regex: "(喂|嗯|诶|哈喽|嗨)([，,。!！?？\\s]|$)"
  # 身份确认模式：请问是 / 是……先生 / 女士（吗 / ？ / 的 结尾可选）
  - name: identity
    regex: "(请问是|是).{0,8}(先生|女士)([，,。!！?？]|吗|的)?"
  # 公司名 / 机构身份模式：我们是 / 我司 / XX银行（公司法务部 / 信用卡中心 等）
  - name: company
    regex: "(我们|本人|我)?是.{0,10}(银行|公司法务部|信用卡中心|催收中心|资产管理|贷款|金融|保险)"
  # 客套语模式：打扰一下 / 麻烦您 / 请问（置于身份确认之后，避免抢占"请问是"）
  - name: polite
    regex: "(打扰一下|麻烦(您)?|请问)"
