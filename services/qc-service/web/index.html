<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>质检演示（M1）</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>质检演示</h1>
      <p class="sub">离线开检 · API <code id="apiLabel"></code></p>
      <p class="sub warn-line">列表合并本地已灌会话与 <code>/demo/pending</code>；不要用 DP pending-qc。人审 JWT 角色 QC。</p>
      <p id="healthBar" class="health-bar">健康检查加载中…</p>
    </div>
    <div class="top-actions">
      <label class="field inline">
        API_BASE
        <input id="apiBase" type="text" value="http://localhost:8003" />
      </label>
      <label class="field inline">
        JWT
        <input id="jwtToken" type="text" placeholder="seed 后自动填入，或粘贴 QC token" autocomplete="off" />
      </label>
      <button type="button" id="btnRefresh" class="btn">刷新列表</button>
      <button type="button" id="btnSeed" class="btn primary">模拟三条待质检通话</button>
    </div>
  </header>

  <p id="toast" class="toast" hidden></p>

  <main class="layout">
    <section class="panel" id="listPanel">
      <div class="list-head">
        <h2>通话列表</h2>
        <label class="field inline compact">
          筛选
          <select id="listFilter">
            <option value="all">全部</option>
            <option value="pending">待检</option>
            <option value="review">待复核</option>
            <option value="reviewed">已人审</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>场景</th>
              <th>session</th>
              <th>call_id</th>
              <th>状态</th>
              <th>分数</th>
            </tr>
          </thead>
          <tbody id="listBody">
            <tr><td colspan="5" class="muted">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="detailPanel" hidden>
      <div class="detail-head">
        <button type="button" id="btnBack" class="btn ghost">← 返回列表</button>
        <h2 id="detailTitle">详情</h2>
      </div>
      <p id="checkBanner" class="judge-banner" hidden>开检中…</p>

      <div class="grid">
        <div>
          <h3>质检结果</h3>
          <dl class="kv" id="detailMeta"></dl>

          <h3>命中表</h3>
          <div class="table-wrap">
            <table class="hits">
              <thead>
                <tr>
                  <th>来源</th>
                  <th>规则/词</th>
                  <th>证据</th>
                  <th>扣分</th>
                  <th>条款</th>
                </tr>
              </thead>
              <tbody id="hitsBody">
                <tr><td colspan="5" class="muted">打开详情后加载…</td></tr>
              </tbody>
            </table>
          </div>

          <h3>跳过规则</h3>
          <ul id="skippedList" class="hint-list">
            <li class="muted">无</li>
          </ul>
        </div>

        <div>
          <h3>人审</h3>
          <p id="reviewHint" class="hint">有扣分须人审：认机检分点「扣分正确」；改分先点「误报改分」再点「关闭质检」。</p>
          <p id="reviewDone" class="review-done" hidden></p>
          <div id="reviewBox" hidden>
            <dl class="kv review-kv">
              <dt>合计扣分</dt><dd id="penaltyTotal">—</dd>
              <dt>机检分</dt><dd id="machineScoreLabel">—</dd>
            </dl>
            <label class="field">
              改后分数（点「误报改分」后可改，点「关闭质检」才生效）
              <input id="revisedScore" type="number" min="0" max="100" step="1" placeholder="0–100" disabled />
            </label>
            <div class="btn-row">
              <button type="button" id="btnConfirm" class="btn primary">扣分正确</button>
              <button type="button" id="btnRescoreMode" class="btn">误报改分</button>
              <button type="button" id="btnCloseQc" class="btn">关闭质检</button>
            </div>
          </div>

          <h3>时间线</h3>
          <p class="hint" id="traceHint">本地时间线（不依赖 LangSmith）</p>
          <p id="mcpNote" class="hint" hidden></p>
          <a id="btnLangSmith" class="btn ghost langsmith-link" href="#" target="_blank" rel="noopener noreferrer" hidden>在 LangSmith 打开</a>
          <ol id="traceTimeline" class="trace-timeline">
            <li class="muted">打开详情后加载…</li>
          </ol>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
