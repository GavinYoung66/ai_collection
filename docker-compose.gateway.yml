services:
  ai-api-gateway:
    image: nginx:1.27-alpine
    container_name: ai-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/gateway/www:/usr/share/nginx/html/www:ro
      - ./services/complaint-service/web:/usr/share/nginx/html/complaint:ro
      - ./services/qc-service/web:/usr/share/nginx/html/qc:ro
      - ./deploy/gateway/prefer-ipv4.sh:/prefer-ipv4.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/sh", "/prefer-ipv4.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on: []
