worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 100m;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       'status=$status trace_id=$trace_id '
                       'request_time=$request_time '
                       'upstream_response_time=$upstream_response_time '
                       'body_bytes_sent=$body_bytes_sent';
    access_log /var/log/nginx/access.log gateway;

    map $http_x_trace_id $trace_id {
        ""      $request_id;
        default $http_x_trace_id;
    }

    limit_req_zone $binary_remote_addr zone=gateway:10m rate=20r/s;

    upstream complaint {
        server host.docker.internal:8006;
        keepalive 64;
    }

    upstream qc {
        server host.docker.internal:8003;
        keepalive 64;
    }

    upstream kb {
        server host.docker.internal:8002;
        keepalive 64;
    }

    upstream web {
        server host.docker.internal:7860;
        keepalive 64;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        index index.html;
        limit_req_status 429;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Trace-Id, X-User-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"code":"B0000","message":"ok","data":{"status":"healthy"},"trace_id":"$trace_id"}';
        }

        location = /health {
            proxy_pass http://qc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/complaints {
            proxy_pass http://complaint;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/stats {
            proxy_pass http://complaint;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/mode {
            proxy_pass http://complaint;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/qc {
            proxy_pass http://qc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/kb {
            proxy_pass http://kb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        location /api/v1/sensitive-words {
            proxy_pass http://kb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            limit_req zone=gateway burst=40 nodelay;
        }

        # Gradio 在子路径 /rag/ 下仍会向 origin 根请求 /manifest.json；
        # 不拦会落到导航页 root 并写 error_log 404。
        location = /manifest.json {
            proxy_pass http://web/rag/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            access_log off;
        }

        location /rag/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /complaint/ {
            alias /usr/share/nginx/html/complaint/;
        }

        location /qc/ {
            alias /usr/share/nginx/html/qc/;
        }

        location / {
            root /usr/share/nginx/html/www;
        }

        error_page 429 = @rate_limited;
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @rate_limited {
            internal;
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Trace-Id, X-User-Id" always;
            return 429 '{"code":"B0006","message":"请求过于频繁","data":null,"trace_id":"$trace_id"}';
        }

        location @bad_gateway {
            internal;
            default_type application/json;
            return 502 '{"code":"B0008","message":"网关错误","data":null,"trace_id":"$trace_id"}';
        }

        location @gateway_timeout {
            internal;
            default_type application/json;
            return 504 '{"code":"B0009","message":"服务暂不可用","data":null,"trace_id":"$trace_id"}';
        }
    }
}
