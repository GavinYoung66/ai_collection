brokerClusterName = DefaultCluster
# 与主 broker 同名（broker-a），brokerId=1 标识从节点
brokerName = broker-a
brokerId = 1
deleteWhen = 04
fileReservedTime = 48
brokerRole = SLAVE
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# 从节点自己的容器 DNS，主节点/Proxy 经此地址做 HA 同步与路由
brokerIP1 = rocketmq-broker-slave
# 持久化：独立命名卷 rocketmq_store_slave（不得与主节点共用卷）
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
