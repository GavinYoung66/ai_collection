brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
# 生产基线：主从同步复制（Slave 落盘后才向 Producer 返回成功），磁盘刷盘保持异步以控时延
brokerRole = SYNC_MASTER
flushDiskType = ASYNC_FLUSH
# Allow auto-create so Proxy can create system topics on first boot
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# 容器内网地址：Proxy / Slave 经 docker DNS 回连本 broker
brokerIP1 = rocketmq-broker
# 持久化：根目录落在命名卷 rocketmq_store_master（见 docker-compose.prod.yml）。
# 与 broker.conf（dev，容器内默认路径）区分，生产不把消息留在容器可写层。
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
